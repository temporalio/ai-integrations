plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '7.0.2'
}

description = 'Temporal LangChain4j integration (Pre-release)'
def latestDependencies = providers.gradleProperty('dependencyMode').getOrElse('locked') == 'latest'
ext {
    javaRelease = 17
    temporalVersion = latestDependencies ? '1.+' : '1.40.0'
    langchain4jVersion = latestDependencies ? '1.+' : '1.23.0'
    // langchain4j-mcp is published only as a beta of each LangChain4j release, which latest mode's
    // stable-only selection would reject, so both modes test this one.
    langchain4jMcpVersion = '1.23.0-beta33'
    latestDependencyGroups = ['io.temporal', 'dev.langchain4j']
}

apply from: '../_shared/java.gradle'

dependencies {
    // Consumers supply the SDK, including when using its shaded artifact.
    compileOnly "io.temporal:temporal-sdk:$temporalVersion"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    api "dev.langchain4j:langchain4j-core:$langchain4jVersion"
    // Optional: MCP tools need LangChain4j's MCP client, and live output needs Workflow Streams.
    compileOnly "dev.langchain4j:langchain4j-mcp:$langchain4jMcpVersion"
    compileOnly "io.temporal:temporal-workflowstreams:$temporalVersion"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.temporal:temporal-sdk:$temporalVersion"
    testImplementation "io.temporal:temporal-testing:$temporalVersion"
    testImplementation "dev.langchain4j:langchain4j:$langchain4jVersion"
    testImplementation "dev.langchain4j:langchain4j-mcp:$langchain4jMcpVersion"
    testImplementation "io.temporal:temporal-workflowstreams:$temporalVersion"
    // The MCP test server runs the official MCP Java SDK over stdio.
    testImplementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.0'
    testImplementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.0'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Subprocess tests (the MCP test server and the optional-dependency probe) read the test runtime
// classpath from a file; Windows limits command lines.
test {
    doFirst {
        def classpathFile = layout.buildDirectory.file('test-runtime-classpath.txt').get().asFile
        classpathFile.parentFile.mkdirs()
        classpathFile.setText(sourceSets.test.runtimeClasspath.asPath, 'UTF-8')
        systemProperty 'langchain4j.test.classpath-file', classpathFile.absolutePath
    }
}
