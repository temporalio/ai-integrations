plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '7.0.2'
}

description = 'Temporal Google ADK integration (Public Preview)'
def latestDependencies = providers.gradleProperty('dependencyMode').getOrElse('locked') == 'latest'
ext {
    javaRelease = 17
    temporalVersion = latestDependencies ? '1.+' : '1.40.0'
    adkVersion = latestDependencies ? '1.+' : '1.12.0'
    // The OpenTelemetry version ADK resolves; the tracing API exposes these types.
    otelVersion = latestDependencies ? '1.+' : '1.51.0'
    latestDependencyGroups = ['io.temporal', 'com.google.adk', 'io.opentelemetry']
}

apply from: '../_shared/java.gradle'

dependencies {
    // Consumers supply the SDK, including when using its shaded artifact.
    compileOnly "io.temporal:temporal-sdk:$temporalVersion"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    api "com.google.adk:google-adk:$adkVersion"
    api "io.opentelemetry:opentelemetry-api:$otelVersion"
    api "io.opentelemetry:opentelemetry-sdk-trace:$otelVersion"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.temporal:temporal-sdk:$temporalVersion"
    testImplementation "io.temporal:temporal-testing:$temporalVersion"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation "io.opentelemetry:opentelemetry-sdk:$otelVersion"
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:$otelVersion"
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Subprocess tests read the test runtime classpath from a file; Windows limits command lines.
test {
    doFirst {
        def classpathFile = layout.buildDirectory.file('test-runtime-classpath.txt').get().asFile
        classpathFile.parentFile.mkdirs()
        classpathFile.setText(sourceSets.test.runtimeClasspath.asPath, 'UTF-8')
        systemProperty 'googleadk.test.classpath-file', classpathFile.absolutePath
    }
}
