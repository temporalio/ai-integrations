[project]
name = "ai-integrations-python-tools"
version = "0"
description = "Python tooling for temporalio/ai-integrations (not published)"
requires-python = ">=3.11"
dependencies = [
  "uv>=0.12.5,<0.13",
  "packaging>=26,<27",
  "build>=1.4,<2",
  "installer>=0.7,<1",
  "uv_build>=0.12.5,<0.13",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pyyaml>=6,<7"]

[tool.uv]
package = false
# Keep in sync with every python/*/pyproject.toml (asserted by ci/check_conventions.py).
required-version = ">=0.12.5,<0.13"
exclude-newer = "2 weeks"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ci", "release"]
