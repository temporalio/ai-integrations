[project]
name = "ai-integrations-python-shared"
version = "0"
description = "Shared Python plugin test tooling (not published)"
requires-python = ">=3.10"
dependencies = [
  "pytest~=9.0",
  "pytest-asyncio>=0.21,<0.22",
  "temporalio>=1.32,<2",
  # Installed on every tooling interpreter so the Python 3.10 fallback is type-checked.
  "tomli>=2.0",
]

[dependency-groups]
dev = [
  "basedpyright==1.34.0",
  "mypy==1.18.2",
  "ruff>=0.15.12,<0.16",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.12.5,<0.13"
exclude-newer = "2 weeks"
exclude-newer-package = { temporalio = false }

[tool.mypy]
files = ["*.py"]
python_version = "3.10"
check_untyped_defs = true

[tool.pyright]
include = ["*.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = true
reportAny = "none"
reportExplicitAny = "none"
reportIgnoreCommentWithoutRule = "none"
reportUnnecessaryTypeIgnoreComment = "none"
reportUnusedCallResult = "none"

[tool.ruff]
target-version = "py310"
