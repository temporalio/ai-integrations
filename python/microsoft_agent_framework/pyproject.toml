[project]
name = "temporalio-microsoft-agent-framework"
version = "0.0.0"  # Development placeholder; protected release tags inject the published version in CI.
description = "Temporal integration for Microsoft Agent Framework"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]   # committed copy of the repository's root LICENSE
classifiers = [
  "Development Status :: 3 - Alpha",   # maturity; must agree with plugin.toml (see AGENTS.md for the mapping)
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "temporalio>=1.36.0,<2",
  # agent-framework-core, not the agent-framework meta package: the meta package is
  # agent-framework-core[all] and installs every provider.
  "agent-framework-core>=1.23.0,<2",
  # Imported at module level for response_format schemas and the data converter.
  "pydantic>=2,<3",
  # Imported at module level by the plugin's OpenTelemetry provider check.
  "opentelemetry-api>=1.40.0,<2",
]

[project.optional-dependencies]
# Lazily imported when MicrosoftAgentFrameworkPlugin(mcp_clients=...) or TemporalMCPToolProvider is used.
mcp = ["temporalio-mcp>=0.3.0,<0.4", "mcp>=2.2,<3", "mcp-types>=2,<3"]

[project.urls]
Homepage = "https://github.com/temporalio/ai-integrations/tree/main/python/microsoft_agent_framework"
Repository = "https://github.com/temporalio/ai-integrations"
Documentation = "https://docs.temporal.io/develop/python/integrations/microsoft-agent-framework"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/temporalio and src/temporalio/contrib must NOT contain __init__.py: the SDK wheel owns them.
module-name = "temporalio.microsoft_agent_framework"

[dependency-groups]
dev = [
  # The provider-error tests run the real OpenAIChatClient against a local HTTP server.
  "agent-framework-openai>=1.17,<2",
  # Used by the MCP tests.
  "temporalio-mcp>=0.3.0,<0.4",
  "mcp>=2.2,<3",
  "mcp-types>=2,<3",
  # Lets the OpenTelemetry warning test install a real SDK provider.
  "opentelemetry-sdk>=1.39,<2",
  "pyright>=1.1.414,<2",
  "basedpyright>=1.40.2,<2",
  "mypy>=1.20.2,<2",
  "ruff>=0.15.12,<0.16",
  "pydocstyle>=6.3,<7",
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4.1,<2",
  "pytest-timeout~=2.2",
  "pytest-xdist>=3.6,<4",
  "pytest-pretty>=1.3",
  "pytest-rerunfailures>=16.1",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.5,<0.13"              # same value in scripts/pyproject.toml; CI reads it via setup-uv version-file
exclude-newer = "2 weeks"                        # org supply-chain cooldown for third-party packages
exclude-newer-package = { temporalio = false, temporalio-mcp = false }   # first-party packages are exempt: SDK and temporalio-mcp releases must be adoptable on day one
link-mode = "copy"
cache-keys = [{ file = "pyproject.toml" }, { file = "README.md" }, { file = "src/**/*" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Temporal's session-scoped environment and every async test share one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Do not use log_cli since this shows logging for all tests, not just the ones
# that failed. Instead, show all logs for failed tests at the end.
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
testpaths = ["tests"]
timeout = 60
timeout_func_only = true
filterwarnings = [
  "error::temporalio.workflow.UnfinishedUpdateHandlersWarning",
  "error::temporalio.workflow.UnfinishedSignalHandlersWarning",
  "ignore::pytest.PytestDeprecationWarning",
  "ignore::DeprecationWarning",
]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
extends = "../_shared/pyrightconfig.json"
include = ["src", "tests"]

# Resolve the plugin's own modules from source rather than from site-packages.
[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

[tool.pydocstyle]
convention = "google"
add_ignore = [
  # We like to wrap at a certain number of chars, even long summary sentences.
  # https://github.com/PyCQA/pydocstyle/issues/184
  "D205",
  "D415",
]

[tool.ruff]
extend = "../_shared/ruff.toml"
src = [".", "src"]
