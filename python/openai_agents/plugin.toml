# Machine-readable plugin metadata, read by scripts/ci/*.py, scripts/release/release_tool.py and
# the plugin's own test suite. Holds no secrets and no owners (CODEOWNERS covers ownership).
# The conventions check asserts these values agree with pyproject.toml. See AGENTS.md.

[plugin]
name = "openai_agents"                  # equals the folder name; Python coordinate = "temporalio-" + name with "_" -> "-"
language = "python"
coordinate = "temporalio-openai-agents"      # package name on the registry
registry = "pypi"
root-api = "temporalio.contrib.openai_agents"            # importable root, always temporalio.contrib.<name> for Python
maturity = "ga"          # ga | preview | experimental; must agree with the Development Status classifier
status = "active"                  # active | deprecated-forwarder (then also set forwards-to = "<coordinate>")
docs = "https://docs.temporal.io/develop/python/integrations/openai-agents"
upstream = "temporalio/sdk-python:temporalio/contrib/openai_agents"   # TRANSITION(sdk-cutover): source of truth until cutover

[release]
# TRANSITION(sdk-cutover): flip to true when the temporalio floor is the SDK release that no longer
# ships this module and every TRANSITION marker in this plugin is gone. Until then only pre-releases
# may be tagged, and the provenance guard tolerates the file overlap with temporalio<=1.32.
allow-final = false

[ci]
runtime-versions = ["3.10", "3.14"]   # first entry must equal the requires-python floor

[smoke]
imports = ["temporalio.contrib.openai_agents.workflow", "temporalio.contrib.openai_agents.testing", "temporalio.contrib.openai_agents.sandbox"]   # extra modules the isolated wheel check imports in addition to root-api

[offline]
# Tests replay recorded HTTP traffic and never hold real credentials (tests/conftest.py).
# dummy-env: placeholder values exported during replay when the variable is unset, so upstream
#            `if not os.environ.get("OPENAI_API_KEY")` skip guards do not skip. Never a real secret.
# skips:     tests skipped while replaying (never while recording), test function name -> reason.
dummy-env = { OPENAI_API_KEY = "sk-cassette-replay" }
# Real-API arms of upstream tests: skipped by policy (no real provider key anywhere, not even for
# recording). Each has an offline twin (`[True]`, SDK test model) that runs.
[offline.skips]
test_lite_llm = "third-party transport stack; already skipped upstream on Python 3.14"
"test_hello_world_agent[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_tool_workflow[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_nexus_tool_workflow[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_research_workflow[False]" = "calls the real OpenAI API (hosted web search); the [True] arm covers the scenario offline"
"test_agents_as_tools_workflow[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_customer_service_workflow[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_input_guardrail[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_output_guardrail[False]" = "calls the real OpenAI API; the [True] arm covers the scenario offline"
"test_file_search_tool[False]" = "calls the real OpenAI API against an account-bound vector store; the [True] arm covers the scenario offline"
"test_mcp_server[False-False-False]" = "calls the real OpenAI API; the use_local_model=True arms cover the scenario offline"
"test_mcp_server[False-True-False]" = "calls the real OpenAI API; the use_local_model=True arms cover the scenario offline"
"test_mcp_server[True-False-False]" = "calls the real OpenAI API; the use_local_model=True arms cover the scenario offline"
test_chat_completions_model = "calls the real OpenAI API (chat completions endpoint); no offline twin upstream"
