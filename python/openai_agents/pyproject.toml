[project]
name = "temporalio-openai-agents"
version = "1.0.0rc1"
description = "Temporal integration for the OpenAI Agents SDK (temporalio.contrib.openai_agents)"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]   # committed copy of the repository's root LICENSE
classifiers = [
  "Development Status :: 5 - Production/Stable",   # maturity; must agree with plugin.toml (see AGENTS.md for the mapping)
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  # TRANSITION(sdk-cutover): raise the floor to the SDK release that no longer ships this module before 1.0.0.
  # opentelemetry and pydantic extras: the plugin imports temporalio.contrib.opentelemetry and
  # temporalio.contrib.pydantic at module level.
  "temporalio[opentelemetry,pydantic]>=1.32.0,<2",
  "openai-agents>=0.19.2,<0.20",
  "openai>=2.45,<3",          # imports openai._models.construct_type and openai.types.responses
  "mcp>=1.19,<2",
  "pydantic>=2,<3",
  "typing-extensions>=4.2,<5",
]

[project.optional-dependencies]
# Lazily imported when OpenAIAgentsPlugin(use_otel_instrumentation=True); see README "OpenTelemetry Integration".
openinference = ["openinference-instrumentation-openai-agents>=0.1.0", "opentelemetry-sdk>=1.26,<2"]

[project.urls]
Homepage = "https://github.com/temporalio/ai-integrations/tree/main/python/openai_agents"
Repository = "https://github.com/temporalio/ai-integrations"
Documentation = "https://docs.temporal.io/develop/python/integrations/openai-agents"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/temporalio and src/temporalio/contrib must NOT contain __init__.py: the SDK wheel owns them.
module-name = "temporalio.contrib.openai_agents"

[dependency-groups]
dev = [
  "pyright==1.1.403",
  "basedpyright==1.34.0",
  "mypy==1.18.2",
  "ruff>=0.15.12,<0.16",
  "pydocstyle>=6.3,<7",
  "pytest~=9.0",
  "pytest-asyncio>=0.21,<0.22",
  "pytest-timeout~=2.2",
  "pytest-xdist>=3.6,<4",
  "pytest-pretty>=1.3",
  "pytest-rerunfailures>=16.1",
  "tomli>=2.0; python_version < '3.11'",
  # Used by the migrated test suite.
  "httpx>=0.28",
  "rich>=13",
  "openinference-instrumentation-openai-agents>=0.1.0",
  "opentelemetry-sdk>=1.26,<2",
  "openai-agents[litellm]>=0.19.2,<0.20; python_version < '3.14'",
  # litellm 1.98.0 through 1.100.0 import typing.NotRequired (3.11+) and fail to import on 3.10;
  # the fix is on litellm main but unreleased. Raise the 3.10 cap once a fixed release is out.
  "litellm>=1.83.0,<1.98; python_version < '3.11'",
  "litellm>=1.83.0; python_version >= '3.11' and python_version < '3.14'",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.5,<0.13"              # same value in scripts/pyproject.toml; CI reads it via setup-uv version-file
exclude-newer = "2 weeks"                        # org supply-chain cooldown for third-party packages
exclude-newer-package = { temporalio = false }   # the SDK is exempt: cutover releases must be adoptable on day one
link-mode = "copy"                               # TRANSITION(sdk-cutover): deterministic overwrites while temporalio<=1.32 ships the same files
cache-keys = [{ file = "pyproject.toml" }, { file = "README.md" }, { file = "src/**/*" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["../_shared"]
# Do not use log_cli since this shows logging for all tests, not just the ones
# that failed. Instead, show all logs for failed tests at the end.
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
testpaths = ["tests"]
timeout = 60
timeout_func_only = true
filterwarnings = [
  "error::temporalio.workflow.UnfinishedUpdateHandlersWarning",
  "error::temporalio.workflow.UnfinishedSignalHandlersWarning",
  "ignore::pytest.PytestDeprecationWarning",
  "ignore::DeprecationWarning",
]

[tool.mypy]
files = ["src", "tests", "../_shared/temporalio_ai_integrations_pytest.py"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
enableTypeIgnoreComments = true
reportAny = "none"
reportCallInDefaultInitializer = "none"
reportExplicitAny = "none"
reportIgnoreCommentWithoutRule = "none"
reportImplicitAbstractClass = "none"
reportImplicitOverride = "none"
reportImplicitStringConcatenation = "none"
reportImportCycles = "none"
reportMissingTypeArgument = "none"
reportPrivateUsage = "none"
reportUnannotatedClassAttribute = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryTypeIgnoreComment = "none"
reportUnusedCallResult = "none"
reportUnknownLambdaType = "none"
include = ["src", "tests", "../_shared/temporalio_ai_integrations_pytest.py"]

# TRANSITION(sdk-cutover): this code reaches sibling contrib packages with relative imports
# (e.g. `from ..opentelemetry._id_generator import ...`), which pyright cannot resolve from a
# split source tree although they work at runtime through site-packages. Silence only under src/
# (basedpyright fails on warnings) until the imports use absolute public names.
[[tool.pyright.executionEnvironments]]
root = "src"
reportMissingImports = "none"

# Everything else (tests, tooling) resolves from the project root, with src/ as an extra root so
# the plugin's own modules are checked from source rather than from site-packages.
[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

[tool.pydocstyle]
convention = "google"
add_ignore = [
  # We like to wrap at a certain number of chars, even long summary sentences.
  # https://github.com/PyCQA/pydocstyle/issues/184
  "D205",
  "D415",
]

[tool.ruff]
target-version = "py310"
src = [".", "src"]

[tool.ruff.lint.isort]
# The SDK owns the top-level `temporalio` package while this project owns only its contrib
# subpackage, so classify every temporalio.* import consistently as first-party.
known-first-party = ["temporalio", "tests"]
