name: Set up Bazel
description: Pinned Bazel, repository cache and commit-scoped disk cache
runs:
  using: composite
  steps:
    - name: Preserve Bazel labels in Windows Bash
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "MSYS_NO_PATHCONV=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "MSYS2_ARG_CONV_EXCL=*" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # v0.18.0
      with:
        bazelisk-cache: true
        repository-cache: true
        disk-cache: ${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
        cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
