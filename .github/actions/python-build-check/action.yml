name: Build and verify Python distribution
description: Build the tested Bazel wheel and source distribution, then check their installed layout
inputs:
  plugin-dir:
    required: true
    description: Plugin directory relative to repository root
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
      run: |
        bazel build "//$PLUGIN_DIR:dist"
        bazel test "//$PLUGIN_DIR:package_test"
        bazel run //python/_tools:check_wheel -- --plugin-dir "$PLUGIN_DIR" --dist "bazel-bin/$PLUGIN_DIR/dist"
        bazel run //python/_tools:smoke -- --plugin "$PLUGIN_DIR" --dist "bazel-bin/$PLUGIN_DIR/dist"
