name: Java plugin
on:
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      deps:
        type: string
        default: locked
      version:
        type: string
        default: ""
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - id: matrix
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: bazel run //java/_tools:ci -- matrix --plugin-dir "java/$PLUGIN" --github-output "$GITHUB_OUTPUT"
  test:
    name: ${{ inputs.plugin }} (${{ matrix.os }}, java${{ matrix.runtime }}, boot${{ matrix.spring_boot }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      PLUGIN_DIR: java/${{ inputs.plugin }}
      RUNTIME: ${{ matrix.runtime }}
      RELEASE_VERSION: ${{ inputs.version || '0.0.0' }}
      SPRING_BOOT: ${{ matrix.spring_boot || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Resolve latest compatible dependencies
        if: inputs.deps == 'latest'
        run: |
          bazel run //java/_tools:dev -- update --plugin-dir "$PLUGIN_DIR"
          bazel mod deps --lockfile_mode=update
      - name: Lint and test
        run: |
          config=( --config=java${RUNTIME%%.*} --//bazel:spring_boot="$SPRING_BOOT" )
          bazel run //java/_tools:format -- --dry-run --set-exit-if-changed --plugin-dir "$PLUGIN_DIR"
          bazel test "${config[@]}" --//bazel:release_version="$RELEASE_VERSION" "//$PLUGIN_DIR:tests"
      - name: Build and verify tested distributions
        if: matrix.dist
        run: |
          config=( --config=java${RUNTIME%%.*} --//bazel:spring_boot="$SPRING_BOOT" )
          bazel build "${config[@]}" --//bazel:release_version="$RELEASE_VERSION" "//$PLUGIN_DIR:dist"
          mkdir -p "$PLUGIN_DIR/dist"
          cp -R "bazel-bin/$PLUGIN_DIR/dist/." "$PLUGIN_DIR/dist/"
          bazel run //java/_tools:package -- check --plugin-dir "$PLUGIN_DIR" --version "$RELEASE_VERSION"
          bazel run //java/_tools:package -- smoke --plugin-dir "$PLUGIN_DIR" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.dist
        with:
          name: dist-java-${{ inputs.plugin }}
          path: java/${{ inputs.plugin }}/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 30
