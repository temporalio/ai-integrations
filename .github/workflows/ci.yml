# Repository CI entry point. One workflow for every language; the plugin is a
# parameter of the per-language reusable workflow (never a per-plugin copy).
#
#   changes      -> which plugins the event touches (Bazel metadata selection)
#   conventions  -> repository invariants + tooling tests (always)
#   python       -> _python-plugin.yml once per changed Python plugin (locked deps; newest on nightly)
#   typescript   -> _typescript-plugin.yml once per changed TypeScript plugin
#   go           -> _go-plugin.yml once per changed Go plugin (same dependency modes)
#   ci-status    -> the ONLY required status check; skipped jobs count as success
#
# No provider secrets are used in CI: tests use deterministic local models,
# mock transports, or in-process servers, so pull requests from forks get the full run.
name: CI

on:
  pull_request:
    # `edited` covers base-branch retargeting (a stacked PR whose base merged), so `changes`
    # is recomputed against the new base instead of keeping the stale selection.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *" # nightly: every plugin, newest allowed dependencies
  workflow_dispatch:
    inputs:
      latest-deps:
        description: Re-resolve the newest supported dependencies before testing
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.detect.outputs.python }}
      typescript: ${{ steps.detect.outputs.typescript }}
      java: ${{ steps.detect.outputs.java }}
      go: ${{ steps.detect.outputs.go }}
      any: ${{ steps.detect.outputs.any }}
      scripts_only: ${{ steps.detect.outputs.scripts_only }}
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Detect changed plugins
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bazel run //python/_tools:ci -- select --github-output "$GITHUB_OUTPUT"

  conventions:
    name: Conventions and tooling tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Check repository conventions
        run: |
          bazel run //:buildifier.check
          bazel run //python/_tools:ci -- conventions
          bazel run //typescript/_tools:ci -- conventions
          bazel run //java/_tools:ci -- conventions
          bazel run //go/_tools:ci -- conventions
      - name: Tooling unit tests
        run: bazel test //python/_tools:tool_tests //typescript/_tools:tool_tests //java/_tools:tool_tests //go/_tools:tool_tests

  python:
    name: Python
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.python != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.changes.outputs.python) }}
    uses: ./.github/workflows/_python-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      deps: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.latest-deps)) && 'latest' || 'locked' }}

  java:
    name: Java
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.java != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.changes.outputs.java) }}
    uses: ./.github/workflows/_java-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      deps: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.latest-deps)) && 'latest' || 'locked' }}

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.typescript != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.changes.outputs.typescript) }}
    uses: ./.github/workflows/_typescript-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      deps: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.latest-deps)) && 'latest' || 'locked' }}

  go:
    name: Go
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.go != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.changes.outputs.go) }}
    uses: ./.github/workflows/_go-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      deps: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.latest-deps)) && 'latest' || 'locked' }}

  nightly-report:
    name: Nightly report
    needs: [changes, python, java, go, typescript]
    if: always() && github.event_name == 'schedule' && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Open, update, or close nightly issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bazel run //python/_tools:ci -- nightly

  ci-status:
    name: ci-status
    needs: [changes, conventions, python, java, go, typescript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled"
            exit 1
          fi
          echo "All required jobs succeeded or were skipped"
