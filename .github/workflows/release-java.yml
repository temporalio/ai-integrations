# Shared Maven Central pipeline. Protected tags supply the version; committed
# Gradle projects stay at 0.0.0. The reusable CI matrix builds the only artifacts
# that may be signed and uploaded. Candidates stop at private VALIDATED staging.
name: Release (Java)

on:
  push:
    tags:
      - "java/*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Intended tag for a branch dry run, e.g. java/spring-ai/v0.1.0-RC1. Leave empty when dispatching on that tag.
        type: string
        default: ""
      skip-publish:
        description: Validate, test and build without uploading or drafting a release
        type: boolean
        default: false
      deployment-id:
        description: Existing Central Portal deployment UUID for recovery on a tag ref; normally use Re-run failed jobs instead
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and version policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
      plugin_dir: ${{ steps.tag.outputs.plugin_dir }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      coordinate: ${{ steps.tag.outputs.coordinate }}
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - name: Dispatch inputs are consistent with the ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DEPLOYMENT_ID: ${{ inputs.deployment-id }}
          SKIP_PUBLISH: ${{ inputs.skip-publish }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::tag input must match the dispatched tag ref"; exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] && [ -z "$INPUT_TAG" ]; then
            echo "::error::a branch dry run needs the intended tag input"; exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] && [ -n "$DEPLOYMENT_ID" ]; then
            echo "::error::deployment recovery requires a protected tag ref"; exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$SKIP_PUBLISH" = "false" ] && [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::publishing dispatches require deployment-id; inspect Portal or re-run the original tag workflow"; exit 1
          fi
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py parse-tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: Java plugin exists
        env:
          LANGUAGE: ${{ steps.tag.outputs.language }}
          PLUGIN_DIR: ${{ steps.tag.outputs.plugin_dir }}
          COORDINATE: ${{ steps.tag.outputs.coordinate }}
        run: |
          [ "$LANGUAGE" = "java" ] && [ -n "$COORDINATE" ] && [ -f "$PLUGIN_DIR/plugin.toml" ] || { echo "::error::expected a registered Java plugin"; exit 1; }
      - name: Tag is reachable from main
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          git rev-parse --verify --quiet origin/main > /dev/null || { echo "::error::origin/main is missing"; exit 1; }
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          if [ "$REF_TYPE" = "tag" ]; then
            echo "::error::release tags must point at a commit on main"; exit 1
          fi
          echo "::warning::branch dry run: this commit is not on main"
      - name: Version policy and final cutover gates
        env:
          PLUGIN_DIR: ${{ steps.tag.outputs.plugin_dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py check-version-policy --plugin-dir "$PLUGIN_DIR" --version "$VERSION"
      - name: Decide whether publication is allowed
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip-publish }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ "$SKIP_PUBLISH" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run: tests and the build run; nothing is signed, uploaded or drafted"
          fi

  test:
    name: Test
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/_java-plugin.yml
    with:
      plugin: ${{ needs.prepare.outputs.plugin }}
      version: ${{ needs.prepare.outputs.version }}

  stage:
    name: Sign, privately stage and verify
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central-staging
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-java-${{ needs.prepare.outputs.plugin }}
          path: dist/
      - name: Recover saved deployment on a failed-job rerun
        continue-on-error: true # absent on the first attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-deployment-${{ needs.prepare.outputs.plugin }}
          path: release-state/
      - name: Stage tested bytes, prove staged files and install a clean consumer
        env:
          PLUGIN_DIR: ${{ needs.prepare.outputs.plugin_dir }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOYMENT_ID: ${{ inputs.deployment-id }}
          RECOVER_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-consumer
        run: |
          RECOVERY_ARGS=()
          if [ "$RECOVER_ONLY" = "true" ]; then
            RECOVERY_ARGS+=(--recover-only)
          fi
          uv run --project scripts --locked python scripts/release/maven_release.py stage \
            --plugin-dir "$PLUGIN_DIR" --version "$VERSION" --dist dist --state-dir release-state \
            --deployment-id "$DEPLOYMENT_ID" --smoke "${RECOVERY_ARGS[@]}"
      - name: Preserve signed bundle and deployment ID for recovery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-deployment-${{ needs.prepare.outputs.plugin }}
          path: release-state/
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  publish:
    name: Publish and verify Maven Central
    needs: [prepare, stage]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-java-${{ needs.prepare.outputs.plugin }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-deployment-${{ needs.prepare.outputs.plugin }}
          path: release-state/
      - name: Publish the verified deployment and prove public installation
        env:
          PLUGIN_DIR: ${{ needs.prepare.outputs.plugin_dir }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-consumer
        run: |
          uv run --project scripts --locked python scripts/release/maven_release.py publish \
            --plugin-dir "$PLUGIN_DIR" --version "$VERSION" --dist dist --state-dir release-state --smoke

  github-release:
    name: Draft GitHub release
    needs: [prepare, stage, publish]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
      && needs.stage.result == 'success'
      && (needs.prepare.outputs.prerelease == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-java-${{ needs.prepare.outputs.plugin }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-deployment-${{ needs.prepare.outputs.plugin }}
          path: release-state/
      - name: Generate release notes from history
        env:
          PLUGIN_DIR: ${{ needs.prepare.outputs.plugin_dir }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          uv run --project scripts --locked python scripts/release/release_tool.py release-notes --plugin-dir "$PLUGIN_DIR" --tag "$TAG" --output notes.md
          cp release-state/bundle.zip dist/central-bundle.zip
          cp release-state/deployment.json dist/central-deployment.json
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.coordinate }} ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          extra=()
          [ "$PRERELEASE" = "true" ] && extra+=(--prerelease)
          uv run --project scripts --locked python scripts/release/release_tool.py draft-release --tag "$TAG" --title "$TITLE" --notes notes.md --dist dist "${extra[@]}"
