# Release pipeline for ONE Python plugin, triggered by a scoped tag such as
# python/openai_agents/v1.0.0rc1. The plugin is a parameter parsed from the tag.
#
#   prepare -> test (reusable CI, full matrix; its ubuntu dist cell builds and checks the artifacts)
#   -> publish-testpypi -> smoke-testpypi -> [finals only] publish-pypi -> smoke-pypi -> github-release (draft)
#
# The artifacts that were tested are the artifacts that get published. Dry run: dispatch on
# main with the `tag` input set to the tag you intend to push; everything up to and including the
# tested build runs, nothing is uploaded and no tag is consumed. A dispatch from a branch can
# never publish; `skip-publish` additionally turns a dispatch on a tag ref into a dry run.
#
# Publishing uses PyPI trusted publishing (OIDC): no stored credentials. The
# publish jobs live INLINE here on purpose: PyPI rejects reusable workflows as
# trusted publishers (warehouse#11096). Pre-releases go to TestPyPI only unless
# dispatched with publish-prerelease-to-pypi; environments gate every upload.
name: Release (Python)

on:
  push:
    tags:
      - "python/*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and build when dispatching from a branch (dry run), e.g. python/mcp/v0.1.0. Leave empty when dispatching on a tag ref.
        type: string
        default: ""
      skip-publish:
        description: Dry run - validate, test and build, but upload nothing and draft no release
        type: boolean
        default: false
      publish-prerelease-to-pypi:
        description: For a pre-release tag ref, also publish to PyPI (still gated by the pypi environment; ignored while plugin.toml [release] allow-final is false)
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag || github.ref }} # dry runs of different tags on main do not queue behind each other
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and version policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      language: ${{ steps.tag.outputs.language }}
      plugin: ${{ steps.tag.outputs.plugin }}
      plugin_dir: ${{ steps.tag.outputs.plugin_dir }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      coordinate: ${{ steps.tag.outputs.coordinate }}
      root_api: ${{ steps.tag.outputs.root_api }}
      smoke_imports: ${{ steps.tag.outputs.smoke_imports }}
      tag: ${{ steps.tag.outputs.tag }}
      allow_final: ${{ steps.tag.outputs.allow_final }}
      publish: ${{ steps.gate.outputs.publish }}
      publish_pypi: ${{ steps.gate.outputs.publish_pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - name: Dispatch inputs are consistent with the ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::tag input '$INPUT_TAG' does not match the dispatched tag ref '$REF_NAME'; dispatch on the tag without a tag input, or on a branch for a dry run"; exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] && [ -z "$INPUT_TAG" ]; then
            echo "::error::dispatching from a branch is a dry run and needs the tag input, e.g. python/mcp/v0.1.0"; exit 1
          fi
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py parse-tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: Tag version matches the manifest
        env:
          PLUGIN_DIR: ${{ steps.tag.outputs.plugin_dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          manifest="$(uv version --short --directory "$PLUGIN_DIR")"
          echo "tag=$VERSION manifest=$manifest"
          uv run --project scripts --locked python - "$VERSION" "$manifest" <<'PY'
          import sys
          from packaging.version import Version
          tag, manifest = sys.argv[1:3]
          if Version(tag) != Version(manifest):
              sys.exit(f"::error::tag version {tag} does not match pyproject version {manifest}")
          PY
      - name: Tag is reachable from main
        # fetch-depth 0 above already brought origin/main; no extra fetch (credentials are not persisted).
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          git rev-parse --verify --quiet origin/main > /dev/null || { echo "::error::origin/main not present in checkout"; exit 1; }
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          if [ "$REF_TYPE" = "tag" ]; then
            echo "::error::release tags must point at a commit on main"; exit 1
          fi
          echo "::warning::dry run from a commit that is not on main; a release tag here would be rejected"
      - name: Version policy
        env:
          PLUGIN_DIR: ${{ steps.tag.outputs.plugin_dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py --repo-root "$PWD" check-version-policy --plugin-dir "$PLUGIN_DIR" --version "$VERSION" --check-testpypi
      - name: Decide whether PyPI publication is allowed
        id: gate
        env:
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          ALLOW_FINAL: ${{ steps.tag.outputs.allow_final }}
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-prerelease-to-pypi }}
          REF_TYPE: ${{ github.ref_type }}
          SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip-publish }}
        run: |
          # Uploads and the draft release happen only for a real tag ref, and never on a dry run.
          # Compare against the literal "false": anything else (a typo such as `True` or `1`) is a dry run.
          if [ "$REF_TYPE" = "tag" ] && [ "$SKIP_PUBLISH" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run: validation, tests and the build run; nothing is uploaded and no release is drafted"
          fi
          # Finals reach PyPI; pre-releases only via the dispatch override, and never while the plugin
          # is still in the SDK-cutover transition (allow-final = false).
          if [ "$PRERELEASE" = "false" ] || { [ "$OVERRIDE" = "true" ] && [ "$ALLOW_FINAL" = "true" ]; }; then
            echo "publish_pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_pypi=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/_python-plugin.yml
    with:
      plugin: ${{ needs.prepare.outputs.plugin }}
      deps: locked

  publish-testpypi:
    name: Publish to TestPyPI
    # dist-<plugin>-locked is built, verified and smoke-tested by the test job's ubuntu dist cell
    # (_python-plugin.yml, deps=locked): the published bytes are the tested bytes.
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.prepare.outputs.plugin }}-locked
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  smoke-testpypi:
    name: Smoke-test from TestPyPI
    needs: [prepare, publish-testpypi]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.prepare.outputs.plugin }}-locked
          path: dist/
      - name: Index files are the tested artifacts
        # skip-existing keeps a re-run from failing, so prove the files the index serves are the
        # bytes this run built (uv_build is reproducible) rather than an earlier upload's.
        env:
          COORDINATE: ${{ needs.prepare.outputs.coordinate }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py verify-index-files --coordinate "$COORDINATE" --version "$VERSION" --dist dist --index testpypi
      - name: Install from TestPyPI into a clean project and smoke-test
        env:
          COORDINATE: ${{ needs.prepare.outputs.coordinate }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ROOT_API: ${{ needs.prepare.outputs.root_api }}
          SMOKE_IMPORTS: ${{ needs.prepare.outputs.smoke_imports }}
          INDEX_URL: https://test.pypi.org/simple/
          # A plugin the SDK still bundles (allow-final = false) may overlap it; any other must not.
          ALLOW_OVERLAP_WITH_CORE: ${{ needs.prepare.outputs.allow_final == 'true' && '0' || '1' }}
        run: bash scripts/release/smoke_from_index.sh

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, smoke-testpypi]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.prepare.outputs.plugin }}-locked
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true

  smoke-pypi:
    name: Smoke-test from PyPI
    needs: [prepare, publish-pypi]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.prepare.outputs.plugin }}-locked
          path: dist/
      - name: Index files are the tested artifacts
        env:
          COORDINATE: ${{ needs.prepare.outputs.coordinate }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py verify-index-files --coordinate "$COORDINATE" --version "$VERSION" --dist dist --index pypi
      - name: Install from PyPI into a clean project and smoke-test
        env:
          COORDINATE: ${{ needs.prepare.outputs.coordinate }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ROOT_API: ${{ needs.prepare.outputs.root_api }}
          SMOKE_IMPORTS: ${{ needs.prepare.outputs.smoke_imports }}
          # Same rule as TestPyPI: only a plugin the SDK still bundles may overlap it.
          ALLOW_OVERLAP_WITH_CORE: ${{ needs.prepare.outputs.allow_final == 'true' && '0' || '1' }}
        run: bash scripts/release/smoke_from_index.sh

  github-release:
    name: Draft GitHub release
    needs: [prepare, smoke-testpypi, smoke-pypi]
    # A skipped smoke-pypi means either "PyPI not applicable" (pre-release) or "publish-pypi failed or
    # was rejected"; only the first may draft a release.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
      && needs.smoke-testpypi.result == 'success'
      && (needs.prepare.outputs.publish_pypi != 'true' || needs.smoke-pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # gh uses GH_TOKEN below; do not leave the write token in .git/config
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.prepare.outputs.plugin }}-locked
          path: dist/
      - name: Generate release notes from history
        env:
          PLUGIN_DIR: ${{ needs.prepare.outputs.plugin_dir }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py --repo-root "$PWD" release-notes --plugin-dir "$PLUGIN_DIR" --tag "$TAG" --output notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.plugin }} ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          extra=()
          [ "$PRERELEASE" = "true" ] && extra+=(--prerelease)
          uv run --project scripts --locked python scripts/release/release_tool.py draft-release --tag "$TAG" --title "$TITLE" --notes notes.md --dist dist "${extra[@]}"
