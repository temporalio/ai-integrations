# Shared NuGet publishing; nuget.org's trusted publishing policy names this file and the `nuget` environment.
name: Release (.NET)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Proposed dotnet/<plugin>/v<version> for a branch dry run; leave empty on a tag ref
        type: string
        default: ""
      skip-publish:
        description: Validate, test and build without uploading
        type: boolean
        default: false
      recover-run:
        description: On a tag ref, reuse a completed dry run or release run's tested package by run ID
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate .NET tag and version policy
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'dotnet/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
      plugin_dir: ${{ steps.tag.outputs.plugin_dir }}
      coordinate: ${{ steps.tag.outputs.coordinate }}
      version: ${{ steps.tag.outputs.version }}
      dotnet_runtime: ${{ steps.tag.outputs.dotnet_runtime }}
      sha: ${{ steps.source.outputs.sha }}
      publish: ${{ steps.gate.outputs.publish }}
      release_url: ${{ steps.release.outputs.url }}
      recovery: ${{ steps.recovery.outputs.recovery || 'false' }}
      artifact_run_id: ${{ steps.recovery.outputs.artifact_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - name: Dispatch inputs are consistent with the ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::tag input must match the dispatched tag ref"; exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] && [ -z "$INPUT_TAG" ]; then
            echo "::error::a branch dry run needs a proposed tag input"; exit 1
          fi
      - name: Parse .NET tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          case "$TAG" in dotnet/*/v*) ;; *) echo "::error::expected dotnet/<plugin>/v<version>"; exit 1 ;; esac
          uv run --project scripts --locked python scripts/release/release_tool.py parse-tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: Pin source and require main-reachable release tags
        id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git rev-parse --verify --quiet origin/main > /dev/null || { echo "::error::origin/main is missing"; exit 1; }
          if [ "$REF_TYPE" = "tag" ]; then
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ] || { echo "::error::checkout differs from tag"; exit 1; }
            git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::release tags must be on main"; exit 1; }
          fi
      - name: Version policy
        env:
          PLUGIN_DIR: ${{ steps.tag.outputs.plugin_dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py check-version-policy --plugin-dir "$PLUGIN_DIR" --version "$VERSION"
      - name: Nightly run is green
        # Releases test the committed lock; the nightly run tests the newest versions users can install.
        # Recovery publishes bytes an earlier run already tested and may have uploaded, so it skips this.
        if: github.event_name != 'workflow_dispatch' || inputs.recover-run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py check-nightly --tag "$TAG"
      - name: Validate publication recovery
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recover-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_ID: ${{ inputs.recover-run }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::NuGet artifact recovery must be dispatched on the release tag"; exit 1
          fi
          uv run --project scripts --locked python scripts/release/release_tool.py check-recovery-run --tag "$TAG" --run-id "$RUN_ID" --github-output "$GITHUB_OUTPUT"
      - name: Decide whether to publish
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip-publish }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ "$SKIP_PUBLISH" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run: no uploads, tags or GitHub releases"
          fi
      - name: Verify the published GitHub release
        id: release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run --project scripts --locked python scripts/release/release_tool.py check-published-release --tag "$TAG" --github-output "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    if: needs.prepare.outputs.recovery != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_dotnet-plugin.yml
    with:
      plugin: ${{ needs.prepare.outputs.plugin }}
      deps: locked
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish tested package to nuget.org
    needs: [prepare, test]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
      && (needs.test.result == 'success' || needs.prepare.outputs.recovery == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: nuget
      url: ${{ needs.prepare.outputs.release_url }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PLUGIN_DIR: ${{ needs.prepare.outputs.plugin_dir }}
      COORDINATE: ${{ needs.prepare.outputs.coordinate }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ needs.prepare.outputs.dotnet_runtime }}.x
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-dotnet-${{ needs.prepare.outputs.plugin }}
          path: dotnet/${{ needs.prepare.outputs.plugin }}/dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
      - name: Check whether these exact bytes are already published
        # Fails on a byte mismatch or an unlisted version, so nothing below can push over a different upload.
        id: existing
        run: uv run --project scripts --locked python scripts/release/release_tool.py nuget-registry-state --coordinate "$COORDINATE" --version "$VERSION" --dist "$PLUGIN_DIR/dist" --github-output "$GITHUB_OUTPUT"
      - name: NuGet login (OIDC to a one-hour API key)
        # Requested right before the push: the temporary key is valid for one hour and one exchange.
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish with NuGet trusted publishing
        # Both pushes run on every attempt: --skip-duplicate turns an existing file into a warning, so a
        # re-run after the package uploaded but the symbols did not completes the upload. Whether nuget.org
        # answers a second identical .snupkg with 409 or accepts it, the step stays green.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$PLUGIN_DIR"/dist/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
          dotnet nuget push "$PLUGIN_DIR"/dist/*.snupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Verify public NuGet bytes
        # nuget.org validates for a few minutes before the flat container lists a version; poll up to 30 minutes.
        run: uv run --project scripts --locked python scripts/release/release_tool.py nuget-registry-state --coordinate "$COORDINATE" --version "$VERSION" --dist "$PLUGIN_DIR/dist" --require-present --attempts 60 --delay 30
      - name: Install the public version in a clean consumer
        run: uv run --project scripts --locked python scripts/ci/smoke_dotnet.py --plugin-dir "$PLUGIN_DIR" --version "$VERSION" --dist "$PLUGIN_DIR/dist" --source https://api.nuget.org/v3/index.json --attempts 5 --delay 30
