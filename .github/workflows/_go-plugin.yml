name: Go plugin
on:
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      deps:
        type: string
        default: locked
      version:
        type: string
        default: ""
      ref:
        type: string
        default: ""
      artifact-name:
        type: string
        default: ""
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - id: matrix
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: bazel run //go/_tools:ci -- matrix --plugin-dir "go/$PLUGIN" --github-output "$GITHUB_OUTPUT"
  test:
    name: ${{ inputs.plugin }} (${{ matrix.os }}, go${{ matrix.runtime }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      PLUGIN_DIR: go/${{ inputs.plugin }}
      RUNTIME: ${{ matrix.runtime }}
      RELEASE_VERSION: ${{ inputs.version || '0.0.0' }}
      SPRING_BOOT: ${{ matrix.spring_boot || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Resolve latest compatible dependencies
        if: inputs.deps == 'latest'
        run: |
          bazel run //go/_tools:dev -- update --plugin-dir "$PLUGIN_DIR"
          bazel mod deps --lockfile_mode=update
      - name: Lint and test
        run: |
          config=( --config=go${RUNTIME:0:1}${RUNTIME:2:2} )
          bazel run "${config[@]}" //go/_tools:lint -- --plugin-dir "$PLUGIN_DIR"
          bazel test "${config[@]}" --//bazel:release_version="$RELEASE_VERSION" "//$PLUGIN_DIR:tests" "//$PLUGIN_DIR:lint" ${{ matrix.dist && '--@rules_go//go/config:race' || '' }}
