# Dependency updates for every plugin lockfile, the tooling project, and pinned actions.
# Dependabot PRs receive no secrets; CI has none, so they run the full suite unchanged.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/python/*"
      - "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
