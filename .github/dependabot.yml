version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/python/*"
      - "/scripts"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directories:
      - "/typescript/*"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "gradle"
    directories:
      - "/java/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "gomod"
    directories:
      - "/go/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
