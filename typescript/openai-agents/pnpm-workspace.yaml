onlyBuiltDependencies:
  - "@temporalio/core-bridge"
  - esbuild
  - protobufjs

# Minimum release age, in minutes (2 weeks)
minimumReleaseAge: 20160

# Allow depending on just published Temporal packages
minimumReleaseAgeExclude:
  - '@temporalio/*'

  # agents-core 0.22.0 lets sandbox clients prepare manifest environments
  # (openai/openai-agents-js#2085). agents-openai pins the same core version.
  - '@openai/agents-core@0.22.0'
  - '@openai/agents-openai@0.22.0'
